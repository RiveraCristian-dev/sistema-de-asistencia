<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVAN - Mi Panel de Asistencias</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F7F4F0] min-h-screen text-stone-800">

    <!-- Barra de Navegación / Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-10 shadow-xs">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xs font-semibold tracking-widest text-[#A1887F] uppercase bg-[#EFEBE9] px-3 py-1 rounded-full">SIVAN</span>
                <h1 class="text-lg font-semibold text-stone-800">Mi Panel Estudiantil</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <p id="userName" class="text-sm font-medium text-stone-700">Alumno</p>
                    <p class="text-xs text-stone-400">Rol: Estudiante</p>
                </div>
                <button onclick="cerrarSesion()" class="bg-[#EFEBE9] hover:bg-[#E0D7D5] text-[#8D6E63] text-xs font-medium px-4 py-2 rounded-xl transition-all cursor-pointer">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-6 py-8 space-y-6">
        
        <!-- Tarjeta de Estado del Semáforo -->
        <div id="cardSemaforo" class="bg-white p-8 rounded-3xl shadow-xl shadow-stone-200/50 border border-stone-100 transition-all">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                    <span id="badgeEstado" class="text-xs font-semibold tracking-widest uppercase px-3 py-1 rounded-full bg-stone-100 text-stone-600">Estado de Asistencia</span>
                    <h2 id="tituloEstado" class="text-2xl font-semibold text-stone-800 mt-2">Cargando estado...</h2>
                    <p id="descEstado" class="text-sm text-stone-500 mt-1">Calculando tu porcentaje de asistencias y faltas.</p>
                </div>
                
                <!-- Indicador Visual del Semáforo -->
                <div class="flex flex-col items-center justify-center p-6 bg-[#FAFAFA] border border-stone-200 rounded-2xl min-w-[140px]">
                    <div id="circuloSemaforo" class="w-12 h-12 rounded-full bg-stone-300 shadow-md mb-2 flex items-center justify-center text-white font-bold">
                        •
                    </div>
                    <span id="textoPorcentaje" class="text-xs font-semibold text-stone-600">--% Asistencia</span>
                </div>
            </div>
        </div>

        <!-- Tarjetas de Resumen (Asistencias / Faltas) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-3xl shadow-lg shadow-stone-200/40 border border-stone-100 flex items-center space-x-4">
                <div class="p-3 bg-emerald-50 text-emerald-700 rounded-2xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-stone-400 uppercase tracking-wider">Asistencias Totales</p>
                    <p id="totalAsistencias" class="text-2xl font-semibold text-stone-800 mt-0.5">-</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-lg shadow-stone-200/40 border border-stone-100 flex items-center space-x-4">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-2xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-stone-400 uppercase tracking-wider">Faltas Acumuladas</p>
                    <p id="totalFaltas" class="text-2xl font-semibold text-stone-800 mt-0.5">-</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Script de Integración -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('nombre');
        const rol = localStorage.getItem('rol_id');

        // Validar que el usuario esté autenticado y sea Alumno (rol_id 3)
        if (!token || rol !== '3') {
            alert('Acceso restringido. Por favor inicia sesión como Alumno.');
            window.location.href = '../index.html';
        } else if (nombre) {
            document.getElementById('userName').textContent = nombre;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '../index.html';
        }

        // Cargar datos de asistencia y semáforo del alumno
        async function cargarDatosAlumno() {
            try {
                // Ajusta la ruta del endpoint según cómo lo nombraste en tu router de alumno
                const res = `${API_URL}/api/alumno/mi-asistencia`; // O el endpoint que creaste para consultar el semáforo
                // Si tu backend requiere el ID o lo extrae del token JWT automáticamente:
                const response = await fetch(`${API_URL}/api/alumno/resumen`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("No se pudo obtener la información de asistencia.");
                const data = await response.json();

                // Actualizar valores en pantalla (ejemplos de propiedades esperadas)
                document.getElementById('totalAsistencias').textContent = data.asistencias ?? 0;
                document.getElementById('totalFaltas').textContent = data.faltas ?? 0;
                
                const porcentaje = data.porcentaje ?? 100;
                document.getElementById('textoPorcentaje').textContent = `${porcentaje}% Asistencia`;

                // Lógica visual del semáforo
                const circulo = document.getElementById('circuloSemaforo');
                const titulo = document.getElementById('tituloEstado');
                const desc = document.getElementById('descEstado');

                if (porcentaje >= 90) {
                    circulo.className = "w-12 h-12 rounded-full bg-emerald-500 shadow-md mb-2 flex items-center justify-center text-white font-bold";
                    circulo.textContent = "V";
                    titulo.textContent = "Semáforo Verde";
                    desc.textContent = "¡Excelente rendimiento! Mantén tu asistencia al corriente.";
                } else if (porcentaje >= 80) {
                    circulo.className = "w-12 h-12 rounded-full bg-amber-400 shadow-md mb-2 flex items-center justify-center text-white font-bold";
                    circulo.textContent = "A";
                    titulo.textContent = "Semáforo Amarillo";
                    desc.textContent = "Precaución: Tienes algunas faltas acumuladas, cuida tu asistencia.";
                } else if (porcentaje >= 70) {
                    circulo.className = "w-12 h-12 rounded-full bg-orange-500 shadow-md mb-2 flex items-center justify-center text-white font-bold";
                    circulo.textContent = "R";
                    titulo.textContent = "Semáforo Rojo";
                    desc.textContent = "Alerta: Estás en riesgo de perder derecho por inasistencias.";
                } else {
                    circulo.className = "w-12 h-12 rounded-full bg-stone-900 shadow-md mb-2 flex items-center justify-center text-white font-bold";
                    circulo.textContent = "N";
                    titulo.textContent = "Semáforo Negro";
                    desc.textContent = "Estado crítico por exceso de faltas.";
                }

            } catch (err) {
                console.error(err);
                document.getElementById('tituloEstado').textContent = "Error al cargar datos";
                document.getElementById('descEstado').textContent = "Verifica tu conexión con el servidor.";
            }
        }

        // Ejecutar al cargar la vista
        cargarDatosAlumno();
    </script>
</body>
</html>
